<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>単語学習</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="sheet">
    <header class="mast">
      <p class="eyebrow">tan5pick</p>
      <h1>単語学習</h1>
    </header>
    <main>
      <section id="screen-open" class="screen">
        <h2 class="sr-only">オープニング</h2>
        <p id="open-message" class="message" hidden></p>
        <section class="panel" aria-labelledby="highscore-label">
          <h2 id="highscore-label" class="label">ハイスコア</h2>
          <p id="highscore-value" class="score-value">記録なし</p>
          <p id="highscore-meta" class="meta">問題セットを読み込んでいます</p>
        </section>
        <div class="field">
          <label for="set-select">問題セット</label>
          <select id="set-select"></select>
        </div>
        <div class="field">
          <label for="limit-range">制限時間 <output id="limit-output" for="limit-range">1.0秒</output></label>
          <input id="limit-range" type="range" min="0.1" max="10" step="0.1" value="1">
          <p class="hint">0.1秒から10秒。ボタンを押さなくても、時間切れで次の問題へ進みます。</p>
        </div>
        <button type="button" id="start-btn" class="btn btn-primary" disabled>スタート</button>
        <button type="button" id="log-btn" class="btn btn-ghost">回答ログ</button>
      </section>

      <section id="screen-play" class="screen" hidden>
        <div class="play-head">
          <p id="progress" class="progress">1 / 10</p>
          <p id="timer-label" class="timer-label" role="timer">残り 1.0秒</p>
        </div>
        <div class="timer-track" aria-hidden="true">
          <div id="timer-bar" class="timer-bar"></div>
        </div>
        <p id="live" class="sr-only" aria-live="polite"></p>
        <h2 id="term" class="term"></h2>
        <div class="choices">
          <button type="button" id="choice-0" class="choice">
            <kbd>1</kbd>
            <span></span>
          </button>
          <button type="button" id="choice-1" class="choice">
            <kbd>2</kbd>
            <span></span>
          </button>
        </div>
        <p class="hint play-hint">1 と 2 のキーでも答えられます。</p>
      </section>

      <section id="screen-result" class="screen" hidden>
        <h2 class="label">結果</h2>
        <p id="result-score" class="score-value"></p>
        <p id="result-note" class="meta"></p>
        <ol id="result-list" class="result-list"></ol>
        <button type="button" id="retry-btn" class="btn btn-primary">もう一度</button>
        <button type="button" id="home-btn" class="btn btn-ghost">オープニングへ</button>
      </section>

      <section id="screen-log" class="screen" hidden>
        <h2 class="label">回答ログ</h2>
        <p class="hint">data/log.jsonl に蓄積した、すべての回答と正誤です。</p>
        <div id="log-list"></div>
        <button type="button" id="log-home-btn" class="btn btn-ghost">オープニングへ</button>
      </section>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
